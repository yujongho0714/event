<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>체험 신청 명단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f6; --card:#fff; --ink:#151a2e; --muted:#5b6380; --line:#dadde9; --navy:#14214f; --gold:#ffd65a; --red:#d62828; --ok:#2e9e4f;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1226; --card:#171e3a; --ink:#eef0f8; --muted:#a3a9c2; --line:#2c355a; } }
:root[data-theme="dark"]{ --bg:#0d1226; --card:#171e3a; --ink:#eef0f8; --muted:#a3a9c2; --line:#2c355a; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4d8bff;outline-offset:2px}
.hidden{display:none!important}
header{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold)}
header small{display:block;font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-size:17px;padding:14px 22px}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.center{text-align:center;padding:60px 16px}
.center p{color:var(--muted);line-height:1.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.bar .sum{margin-left:auto;font-weight:700;color:var(--muted);font-size:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item.done{opacity:.55}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .who{font-family:var(--display);font-weight:400;font-size:20px}
.item .when{font-size:12px;color:var(--muted)}
.item .info{margin:6px 0 10px;font-size:15px;line-height:1.55}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);margin-right:4px}
.tag.b{background:var(--navy);color:#fff}
.tag.m{background:#fff4d1;color:#8a5a00}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:8px 12px;font-size:13px}
.acts .btn.done-on{border-color:var(--ok);color:var(--ok)}
.acts .del{margin-left:auto;color:var(--red)}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
.sendbox{background:var(--card);border:2px solid #1d7a4c;border-radius:14px;padding:14px;margin-bottom:12px}
.sendbox .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sendbox b{font-size:16px;flex:1 1 auto}
.sendbox .btn.go{background:#1d7a4c;border-color:#1d7a4c;color:#fff}
.sendbox textarea{width:100%;min-height:170px;margin-top:10px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:14px/1.55 "Noto Sans KR",sans-serif}
.sendbox .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.tag.lead{background:#1d7a4c;color:#fff}
.tag.sent{background:#e6f4ec;color:#1d7a4c}
.tag.unsent{background:#fff1f1;color:#a11}
.seq{position:fixed;inset:0;z-index:60;background:rgba(10,14,30,.7);display:flex;align-items:center;justify-content:center;padding:18px}
.seq .bx{background:var(--card);color:var(--ink);border-radius:18px;width:min(420px,100%);padding:22px 18px;text-align:center}
.seq .cnt{color:var(--muted);font-weight:700}
.seq .ph{font-family:var(--display);font-size:34px;margin:10px 0 4px;letter-spacing:1px}
.seq .pz{color:var(--muted);font-size:14px;min-height:20px}
.seq .send{display:block;margin:16px 0 10px;padding:16px;border-radius:12px;background:#1d7a4c;color:#fff;font-family:var(--display);font-size:22px;text-decoration:none;box-shadow:0 4px 0 #0f4a2d}
.seq .row2{display:flex;gap:8px}.seq .row2 button{flex:1}
</style>
</head>
<body>
<header>
  <div><h1>체험 신청 명단</h1><small>격파 이벤트 · 관장님 전용</small></div>
  <button class="btn hidden" id="logoutBtn" type="button">로그아웃</button>
</header>
<div class="wrap">
  <div class="center" id="loginBox">
    <p>구글 계정으로 로그인하면 신청 명단이 보여요.</p>
    <button class="btn main" id="loginBtn" type="button">구글로 로그인</button>
    <p id="loginMsg"></p>
  </div>

  <div id="listBox" class="hidden">
    <div class="bar">
      <select id="fBranch" aria-label="도장 선택"><option value="">전체 도장</option><option value="2관">2관</option><option value="1·3관">1·3관</option></select>
      <select id="fType" aria-label="신청 구분"><option value="">전체 구분</option><option value="event">격파 이벤트 당첨</option><option value="normal">일반 체험 신청</option><option value="consult">온라인 상담</option><option value="lead">문자 안내 요청</option></select>
      <select id="fDone" aria-label="연락 상태"><option value="">전체</option><option value="todo">연락 전</option><option value="done">연락 완료</option></select>
      <button class="btn" id="csvBtn" type="button" style="background:#1d7a4c;border-color:#1d7a4c;color:#fff">엑셀 파일 받기</button>
      <span class="sum" id="sum"></span>
    </div>
    <div class="sendbox" id="sendBox">
      <div class="row"><b>안내 문자 보낼 사람 <span id="pendN">0</span>명</b>
        <button class="btn go" id="seqBtn" type="button">차례로 보내기</button>
        <button class="btn" id="tplBtn" type="button">문자 내용 고치기</button></div>
      <div id="tplBox" class="hidden">
        <textarea id="tpl" aria-label="안내 문자 내용"></textarea>
        <p class="hint">{경품}은 당첨 경품으로 바뀌고, 경품이 없으면 그 줄은 빠져요. 광고성 문자라서 맨 앞 "(광고)"와 마지막 수신거부 안내는 지우지 마세요.</p>
        <div class="row" style="margin-top:8px"><button class="btn go" id="tplSave" type="button">저장</button><button class="btn" id="tplReset" type="button">기본 문구로</button></div>
      </div>
      <p class="hint">한 사람씩 문자 창이 열려요. 전송을 누르고 돌아오면 다음 사람이 나와요. 여러 명을 한 문자에 넣으면 단체 대화방이 돼서 서로 번호가 보일 수 있어서, 한 명씩 보내게 만들었어요.</p>
    </div>
    <div id="list"></div>
    <p class="note">보관 기간(이벤트 후 3개월)이 지나면 <button class="btn" id="cleanBtn" type="button">3개월 지난 신청 삭제</button> 를 눌러 정리해 주세요.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
var firebaseConfig={
  apiKey:"AIzaSyBhQaR8YuG4CovQgFBaPKd2nZSO7ZjP0PY",
  authDomain:"taekwondo-wordgame.firebaseapp.com",
  databaseURL:"https://taekwondo-wordgame-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"taekwondo-wordgame",
  storageBucket:"taekwondo-wordgame.firebasestorage.app",
  messagingSenderId:"376591184218",
  appId:"1:376591184218:web:d4a4ee50773e787e300363"
};
var $=function(id){return document.getElementById(id);};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(), db=firebase.database(), ref=db.ref("event_signups");
var rows=[], listening=false;

$("loginBtn").addEventListener("click",function(){
  var p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(function(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) return auth.signInWithRedirect(p);
    $("loginMsg").textContent="로그인하지 못했어요: "+(e&&e.code||e);
  });
});
$("logoutBtn").addEventListener("click",function(){ auth.signOut(); });

auth.onAuthStateChanged(function(u){
  if(!u){ $("loginBox").classList.remove("hidden"); $("listBox").classList.add("hidden"); $("logoutBtn").classList.add("hidden"); if(listening){ref.off();listening=false;} return; }
  $("logoutBtn").classList.remove("hidden");
  $("loginMsg").textContent="";
  listening=true;
  ref.on("value",function(snap){
    rows=[]; snap.forEach(function(ch){ var v=ch.val()||{}; v.id=ch.key; rows.push(v); });
    rows.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    $("loginBox").classList.add("hidden"); $("listBox").classList.remove("hidden");
    render();
  },function(err){
    listening=false;
    $("loginBox").classList.remove("hidden"); $("listBox").classList.add("hidden");
    $("loginMsg").textContent=u.email+" 계정은 명단을 볼 권한이 없어요. 보안 규칙의 이메일을 확인해 주세요.";
  });
});

function fmtTime(t){ if(!t) return ""; var d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+("0"+d.getMinutes()).slice(-2); }
function fmtPhone(p){ p=String(p||""); return p.length===11?p.slice(0,3)+"-"+p.slice(3,7)+"-"+p.slice(7):p.length===10?p.slice(0,3)+"-"+p.slice(3,6)+"-"+p.slice(6):p; }
function visitText(v){ if(!v) return ""; if(v==="오늘") return "당일 방문"; var p=v.split("-"); if(p.length!==3) return v; var d=new Date(+p[0],+p[1]-1,+p[2]); return (d.getMonth()+1)+"월 "+d.getDate()+"일("+"일월화수목금토"[d.getDay()]+")"; }
function typeOf(r){ if(r.kind==="lead") return "lead"; var p=r.prize||""; if(p==="온라인 상담") return "consult"; if(p===""||p==="일반 신청") return "normal"; return "event"; }
function filtered(){
  var fb=$("fBranch").value, fd=$("fDone").value, ft=$("fType").value;
  return rows.filter(function(r){ return (!fb||r.branch===fb)&&(!fd||(fd==="done"?r.done:!r.done))&&(!ft||typeOf(r)===ft); });
}

function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function render(){
  $("pendN").textContent=pending().length;
  var list=$("list"), data=filtered(); list.innerHTML="";
  $("sum").textContent="총 "+data.length+"건 · 연락 전 "+data.filter(function(r){return !r.done;}).length+"건";
  if(!data.length){ list.appendChild(el("p","note","아직 신청이 없어요. QR로 신청이 들어오면 여기에 바로 나타나요.")); return; }
  data.forEach(function(r){
    var box=el("div","item"+(r.done?" done":""));
    var top=el("div","top"); top.appendChild(el("span","who",contactText(r))); top.appendChild(el("span","when","신청 "+fmtTime(r.createdAt))); box.appendChild(top);
    var info=el("div","info");
    if(r.kind==="lead"){ info.appendChild(el("span","tag lead","문자 안내 요청")); info.appendChild(el("span","tag "+(r.sent?"sent":"unsent"),r.sent?"안내 보냄":"아직 안 보냄")); }
    else info.appendChild(el("span","tag b",r.branch||""));
    if(r.prize) info.appendChild(el("span","tag",r.prize));
    info.appendChild(el("span","tag"+(r.marketing?" m":""),r.marketing?"소식 문자 동의":"소식 문자 미동의"));
    if(r.kind!=="lead"){ info.appendChild(document.createElement("br"));
    info.appendChild(document.createTextNode(visitText(r.visit)+" · "+(r.cls||"")+" · "+(r.kids||""))); }
    if(r.area||r.school){ info.appendChild(document.createElement("br")); info.appendChild(document.createTextNode("사는 곳: "+(r.area||"-")+" · 학교: "+(r.school||"-"))); }
    box.appendChild(info);
    var acts=el("div","acts");
    if(r.phone){ var call=el("a","btn","전화"); call.href="tel:"+r.phone; acts.appendChild(call);
      var sms=el("a","btn","문자"); sms.href="sms:"+r.phone; acts.appendChild(sms); }
    else if(r.contact==="kakao"){ var kk=el("a","btn","카톡 열기"); kk.href="https://open.kakao.com/o/sC74HRQi"; kk.target="_blank"; acts.appendChild(kk); }
    if(r.kind==="lead"){ var sb=el("button","btn",r.sent?"보냄 취소":"보냄으로 표시"); sb.type="button"; sb.addEventListener("click",function(){ ref.child(r.id).update({sent:!r.sent}); }); acts.appendChild(sb);
      var one=el("a","btn","안내 문자"); one.href=smsTo(r.phone,leadMsg(r)); one.addEventListener("click",function(){ ref.child(r.id).update({sent:true,sentAt:firebase.database.ServerValue.TIMESTAMP}); }); acts.appendChild(one); }
    var dn=el("button","btn"+(r.done?" done-on":""),r.done?"연락 완료 ✓":"연락 완료로 표시"); dn.type="button";
    dn.addEventListener("click",function(){ ref.child(r.id).update({done:!r.done}); }); acts.appendChild(dn);
    var del=el("button","btn del","삭제"); del.type="button";
    del.addEventListener("click",function(){ if(confirm(contactText(r)+" 신청을 삭제할까요?")) ref.child(r.id).remove(); }); acts.appendChild(del);
    box.appendChild(acts); list.appendChild(box);
  });
}
$("fBranch").addEventListener("change",render); $("fDone").addEventListener("change",render); $("fType").addEventListener("change",render);

var DEF_TPL="(광고) [정도태권도] 체험 신청 접수 안내\n격파 이벤트에 참여해 주셔서 감사합니다!\n당첨: {경품}\n\n▶ 체험 신청: https://yujongho0714.github.io/event/info.html\n▶ 도장 홈페이지: https://yujongho0714.github.io/jungdo/\n\n문의: 010-8334-5800\n수신거부: 이 번호로 \"거부\"라고 답장 주세요";
var TPL=DEF_TPL;
firebase.database().ref("site/leadMsg").on("value",function(s){ var v=s.val(); TPL=(typeof v==="string"&&v.trim())?v:DEF_TPL; },function(){});
function leadMsg(r){ var p=(r&&r.prize)||""; return TPL.split("\n").filter(function(l){ return p||l.indexOf("{경품}")<0; }).join("\n").split("{경품}").join(p); }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1); }
function smsTo(num,body){ var b=encodeURIComponent(body); return isIOS()?("sms:"+num+"&body="+b):("sms:"+num+"?body="+b); }
function pending(){ var seen={}, out=[]; rows.filter(function(r){ return r.kind==="lead"&&!r.sent&&r.phone; }).forEach(function(r){ if(!seen[r.phone]){ seen[r.phone]=1; out.push(r); } }); return out.reverse(); }
$("tplBtn").addEventListener("click",function(){ $("tplBox").classList.toggle("hidden"); $("tpl").value=TPL; });
$("tplReset").addEventListener("click",function(){ $("tpl").value=DEF_TPL; });
$("tplSave").addEventListener("click",function(){ var v=$("tpl").value.trim(); firebase.database().ref("site/leadMsg").set(v||null).then(function(){ alert("문자 내용을 저장했어요."); $("tplBox").classList.add("hidden"); },function(){ alert("저장하지 못했어요."); }); });
var seqList=[], seqI=0, seqEl=null;
function markSent(r){ rows.filter(function(x){ return x.kind==="lead"&&x.phone===r.phone&&!x.sent; }).forEach(function(x){ ref.child(x.id).update({sent:true,sentAt:firebase.database.ServerValue.TIMESTAMP}); }); }
function seqShow(){
  if(seqEl) seqEl.remove(); seqEl=null;
  if(seqI>=seqList.length){ alert(seqList.length?"모두 보냈어요!":"보낼 사람이 없어요."); return; }
  var r=seqList[seqI]; seqEl=el("div","seq"); var bx=el("div","bx");
  bx.appendChild(el("div","cnt",(seqI+1)+" / "+seqList.length));
  bx.appendChild(el("div","ph",fmtPhone(r.phone)));
  bx.appendChild(el("div","pz",r.prize?("당첨: "+r.prize):""));
  var a=el("a","send","문자 보내기"); a.href=smsTo(r.phone,leadMsg(r));
  a.addEventListener("click",function(){ markSent(r); seqI++; setTimeout(seqShow,600); });
  bx.appendChild(a);
  var row=el("div","row2"); var sk=el("button","btn","건너뛰기"); sk.type="button"; sk.addEventListener("click",function(){ seqI++; seqShow(); });
  var st=el("button","btn","그만하기"); st.type="button"; st.addEventListener("click",function(){ seqEl.remove(); seqEl=null; });
  row.appendChild(sk); row.appendChild(st); bx.appendChild(row); seqEl.appendChild(bx); document.body.appendChild(seqEl);
}
$("seqBtn").addEventListener("click",function(){ seqList=pending(); seqI=0; seqShow(); });
function contactText(r){ if(r.phone) return fmtPhone(r.phone); return r.contact==="kakao"?"카톡 상담":"문자 신청 (번호는 문자함에서)"; }
function kidRows(r){
  if(Array.isArray(r.kidsList)&&r.kidsList.length) return r.kidsList;
  return String(r.kids||"").split("/").filter(Boolean).map(function(s){ var p=s.trim().split(/\s+/); var age=p.pop()||"", g=p.pop()||""; return {name:p.join(" "),g:g,age:age}; });
}
function stage(age){ var n=parseInt(age,10); if(isNaN(n)) return age||""; return n<=7?"유치부":"초등부"; }
$("csvBtn").addEventListener("click",function(){
  var data=filtered();
  if(!data.length){ alert("받을 신청이 없어요."); return; }
  var head=["학교·유치원","구분","성별","도장","나이","사는 곳","연락 방법","신청 일시","신청 종류","방문 희망일","희망 수업","소식 문자 동의","연락 완료"];
  var aoa=[head];
  data.forEach(function(r){
    var kind=typeOf(r)==="lead"?("문자 안내 요청"+(r.prize?" ("+r.prize+")":"")+(r.sent?" · 보냄":" · 안 보냄")):typeOf(r)==="event"?"격파 이벤트 ("+r.prize+")":typeOf(r)==="consult"?"온라인 상담":"일반 체험 신청";
    var ks=kidRows(r); if(!ks.length) ks=[{name:"",g:"",age:""}];
    ks.forEach(function(k){
      aoa.push([r.school||"",stage(k.age),k.g||"",r.branch||"",k.age||"",r.area||"",contactText(r),new Date(r.createdAt||0).toLocaleString("ko-KR"),kind,visitText(r.visit),r.cls||"",r.marketing?"동의":"미동의",r.done?"완료":""]);
    });
  });
  var d=new Date(), stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  if(window.XLSX){
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:16},{wch:8},{wch:6},{wch:8},{wch:8},{wch:16},{wch:15},{wch:20},{wch:20},{wch:14},{wch:18},{wch:12},{wch:8}];
    ws["!autofilter"]={ref:"A1:M"+aoa.length};
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"신청 명단");
    XLSX.writeFile(wb,"jeongdo_signups_"+stamp+".xlsx");
  } else {
    var q=function(s){ s=String(s==null?"":s); return '"'+s.replace(/"/g,'""')+'"'; };
    var blob=new Blob(["\ufeff"+aoa.map(function(r){ return r.map(q).join(","); }).join("\r\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="jeongdo_signups_"+stamp+".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
});
$("cleanBtn").addEventListener("click",function(){
  var limit=Date.now()-1000*60*60*24*92, old=rows.filter(function(r){return (r.createdAt||0)<limit;});
  if(!old.length){ alert("3개월 지난 신청이 없어요."); return; }
  if(!confirm(old.length+"건을 삭제할까요? 되돌릴 수 없어요.")) return;
  var up={}; old.forEach(function(r){ up[r.id]=null; }); ref.update(up);
});
})();
</script>
